workflows:
  ios-simulator-check:
    name: iOS simulator check
    instance_type: mac_mini_m2
    max_build_duration: 20
    environment:
      xcode: 26.6
      cocoapods: default
    scripts:
      - name: Download official Codemagic sample
        script: git clone --depth 1 https://github.com/codemagic-ci-cd/codemagic-sample-projects.git sample
      - name: Install sample dependencies
        working_directory: sample/ios/ios-native-quick-start
        script: pod install
      - name: Build for iOS Simulator without signing
        working_directory: sample/ios/ios-native-quick-start
        script: |
          xcodebuild -workspace swiftly.xcworkspace -scheme swiftly -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Launch demo and capture simulator
        working_directory: sample/ios/ios-native-quick-start
        script: |
          set -e
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if "iPhone" in x["name"]))')
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          APP_PATH=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP_PATH/Info.plist")
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID"
          sleep 5
          xcrun simctl io "$DEVICE_ID" screenshot simulator.png
    artifacts:
      - sample/ios/ios-native-quick-start/build/Build/Products/Debug-iphonesimulator/*.app
      - sample/ios/ios-native-quick-start/simulator.png
